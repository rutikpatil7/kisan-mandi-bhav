{% extends "base.html" %}{% block content %}
<div class="card"><h1>Mandi Map — Free Leaflet + OpenStreetMap (no Google key)</h1><div id="map" style="height:420px"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>var map=L.map('map').setView([22,79],5);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
{% for p in points %}L.marker([{{p.latitude}},{{p.longitude}}]).addTo(map).bindPopup("<b>{{p.mandi}}</b>, {{p.state}}<br>Avg price ₹{{p.modal_price|round}}");{% endfor %}</script>
{% endblock %}
