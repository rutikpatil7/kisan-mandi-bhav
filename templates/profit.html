{% extends "base.html" %}{% block content %}
<div class="card"><h1>Profit Calculator / Munafa Calculator</h1>
<form method="post"><label>Quintals</label><input type="number" step="0.5" name="quintals" value="10">
<label>Price ₹/quintal</label><input type="number" name="price" value="2000">
<label>Transport total ₹</label><input type="number" name="transport" value="1000">
<label>Other cost ₹ (labour, bags)</label><input type="number" name="other" value="500"><button class="btn">Calculate</button></form></div>
{% if result %}<div class="card"><h2>Result</h2><p>Gross sale: ₹{{result.gross}}<br>Total cost: ₹{{result.cost}}<br><b>Net profit: ₹{{result.net}} (₹{{result.per_quintal}}/quintal)</b></p></div>{% endif %}
{% endblock %}
